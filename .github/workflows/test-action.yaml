name: "Test AI Changelog Action"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: number
      api_base:
        description: 'OpenAI-compatible API base URL (empty = Anthropic via ANTHROPIC_API_KEY secret)'
        required: false
        type: string
        default: ''
      model:
        description: 'Model ID (required with api_base; empty = action default for Anthropic)'
        required: false
        type: string
        default: ''

jobs:
  test-action:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run AI Changelog Action
        uses: ./
        with:
          PR_NUMBER: ${{ inputs.pr_number }}
          API_BASE: ${{ inputs.api_base }}
          MODEL: ${{ inputs.model }}
          AI_TOKEN: ${{ secrets.AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
