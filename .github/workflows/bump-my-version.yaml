---
name: Bump version

# Step 1 of the release flow. Thin caller of the qte77/.github reusable: bumps the
# files listed under [tool.bumpversion] in pyproject.toml (pyproject, README badge,
# CHANGELOG [Unreleased] promotion), makes one signed commit on a bump branch and
# opens a PR. Tag, GitHub Release and the floating major tag follow in
# tag-release.yaml once that PR is merged to main.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: '[major|minor|patch]'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'major'
          - 'minor'
          - 'patch'

permissions:
  contents: read

jobs:
  bump:
    uses: qte77/.github/.github/workflows/bump-version.yml@aeef158fdd62a865aecd03571eaecbe3aa8169e4  # v0.1.2
    permissions:
      contents: write
      pull-requests: write
    with:
      bump_type: ${{ inputs.bump_type }}
      # Same bump-my-version release the inline workflow used (callowayproject/bump-my-version 1.8.1).
      bump_my_version_pin: "1.8.1"
...
