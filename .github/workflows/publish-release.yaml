---
name: Publish Release

# Manual re-publish of an existing tag (for example after a failed publish job).
# The tag is required: the reusable's "latest v* tag" lookup could pick the floating
# major tag (v1) instead of a release tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: qte77/.github/.github/workflows/publish-release.yml@aeef158fdd62a865aecd03571eaecbe3aa8169e4  # v0.1.2
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
...
